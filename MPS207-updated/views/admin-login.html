<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Login — MPS207</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#141414; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .box { background:#1e1e1e; padding:2.5rem; border-radius:10px; width:100%; max-width:340px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  h1 { font-size:1.3rem; margin:0 0 1.5rem; text-align:center; }
  h1 span { color:#e4141b; }
  label { display:block; font-size:.85rem; margin-bottom:.3rem; color:#bbb; }
  input { width:100%; padding:.7rem; margin-bottom:1rem; border-radius:6px; border:1px solid #333; background:#111; color:#fff; box-sizing:border-box; }
  button { width:100%; padding:.8rem; background:#e4141b; color:#fff; border:none; border-radius:6px; font-weight:700; cursor:pointer; font-size:1rem; }
  button:hover { background:#c11017; }
  .error { color:#ff6b6b; font-size:.85rem; text-align:center; margin-bottom:1rem; }
</style>
</head>
<body>
  <div class="box">
    <h1>MPS<span>207</span> — Admin</h1>
    <!--ERROR-->
    <form method="POST" action="/admin/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <button type="submit">Log In</button>
    </form>
  </div>
</body>
</html>
